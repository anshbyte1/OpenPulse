[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openpulse"
version = "0.1.0"
description = "A lightweight dashboard for GitHub repository activity and maintenance signals."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["requests>=2.31,<3", "streamlit>=1.35,<2", "pandas>=2.0,<3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
